name: Release (macOS, Linux) & publish to Homebrew + APT

# Fires on every push to main, but the actual build/release only runs when
# package.json's version doesn't already have a matching GitHub release —
# i.e. only on commits that bump the version number. A plain push to main
# (docs, refactors, etc.) is a fast no-op: one quick job, no builds.
#
# To ship a new version: bump "version" in package.json, commit, push to
# main. CI takes it from there — builds the unsigned macOS DMGs and Linux
# .deb/AppImage packages, publishes a GitHub Release with all of them
# attached, updates Casks/potli.rb in THIS repo (which doubles as both the
# app source and the Homebrew tap — it's named homebrew-potli, which is all
# Homebrew requires) so `brew upgrade --cask potli` picks it up, and
# rebuilds + re-signs the separate apt-potli repo so `sudo apt upgrade`
# picks it up too. See CI_CD_SETUP.md for the one-time setup the APT side
# needs (a PAT + a GPG signing key) — Homebrew needs no extra setup at all.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v$VERSION yet — will build and publish."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    # Apple Silicon GitHub-hosted runner. electron-builder's mac target packages
    # BOTH arm64 and x64 DMGs from this single host in one `--mac` invocation —
    # the same thing that happens when building locally on an M-series Mac —
    # so no separate Intel runner/matrix is needed.
    runs-on: macos-14
    outputs:
      arm_sha256: ${{ steps.checksums.outputs.arm_sha256 }}
      intel_sha256: ${{ steps.checksums.outputs.intel_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build & package (unsigned)
        env:
          # No Apple Developer identity exists on this runner — tell
          # electron-builder not to go looking for one so it produces a
          # plain unsigned build instead of failing/hanging on discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac

      - name: Compute checksums
        id: checksums
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          ARM_DMG="release/Potli-${VERSION}-arm64.dmg"
          INTEL_DMG="release/Potli-${VERSION}.dmg"
          if [ ! -f "$ARM_DMG" ] || [ ! -f "$INTEL_DMG" ]; then
            echo "Expected DMGs not found in release/:"
            ls -la release/ || true
            exit 1
          fi
          ARM_SHA=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 "$INTEL_DMG" | awk '{print $1}')
          echo "arm_sha256=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "intel_sha256=$INTEL_SHA" >> "$GITHUB_OUTPUT"
          echo "arm64:  $ARM_SHA"
          echo "intel:  $INTEL_SHA"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          gh release create "v$VERSION" \
            "release/Potli-${VERSION}-arm64.dmg" \
            "release/Potli-${VERSION}.dmg" \
            --repo "${{ github.repository }}" \
            --title "Potli v$VERSION" \
            --notes "Automated release from main. Unsigned build — see the tap README for the one-time Gatekeeper step after installing."

  build-and-attach-linux:
    needs: [check-version, build-and-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Packages BOTH x64 and arm64 .deb + AppImage from this one x64 runner —
      # electron-builder doesn't need to execute the target arch to package it,
      # only to zip/repack prebuilt Electron binaries for it.
      - run: npm run package:linux

      - name: Attach Linux assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          shopt -s nullglob
          ASSETS=(release/*.deb release/*.AppImage)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No .deb/.AppImage files found in release/:"
            ls -la release/ || true
            exit 1
          fi
          echo "Uploading: ${ASSETS[*]}"
          # --clobber in case this step is re-run after a partial failure.
          gh release upload "v$VERSION" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber

      # Hands the .deb files to update-apt-repo below without rebuilding —
      # each job runs on its own fresh runner, so files don't persist between
      # jobs on their own.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debs
          path: release/*.deb
          retention-days: 1

  update-apt-repo:
    needs: [check-version, build-and-attach-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for the update script)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout the apt-potli repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/apt-potli
          # A fine-grained PAT scoped to apt-potli with Contents: read/write
          # — GITHUB_TOKEN can't push to a different repo. Can be the same
          # PAT value as HOMEBREW_TAP_TOKEN if it's scoped to both repos.
          # See CI_CD_SETUP.md for how to create/add this secret.
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt

      - uses: actions/download-artifact@v4
        with:
          name: linux-debs
          path: debs

      - name: Import the APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          if [ -z "$KEY_ID" ]; then
            echo "No secret key was imported — check the APT_GPG_PRIVATE_KEY secret." >&2
            exit 1
          fi
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      - name: Rebuild the APT repo index and sign it
        run: |
          chmod +x main/scripts/update-apt-repo.sh
          main/scripts/update-apt-repo.sh apt debs/*.deb

      - name: Commit & push the apt-potli repo
        working-directory: apt
        run: |
          git config user.name "potli-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "APT repo already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "potli ${{ needs.check-version.outputs.version }}"
          git push

  update-tap:
    needs: [check-version, build-and-release]
    runs-on: ubuntu-latest
    steps:
      # This repo IS the Homebrew tap (it's named homebrew-potli, and Homebrew
      # only cares that Casks/potli.rb exists somewhere in it — it doesn't
      # need a repo containing nothing else). So there's no second repo to
      # check out here, and no separate PAT needed: GITHUB_TOKEN can already
      # push back to the same repo the workflow is running in, given the
      # `permissions: contents: write` above. GITHUB_TOKEN-authored pushes
      # also don't retrigger `on: push` workflows, so this can't loop.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update the cask with the new version + checksums
        run: |
          node scripts/update-cask.js \
            "Casks/potli.rb" \
            "${{ needs.check-version.outputs.version }}" \
            "${{ needs.build-and-release.outputs.arm_sha256 }}" \
            "${{ needs.build-and-release.outputs.intel_sha256 }}"

      - name: Commit & push
        run: |
          git config user.name "potli-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/potli.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "potli ${{ needs.check-version.outputs.version }}"
          git push
