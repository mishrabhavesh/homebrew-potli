appId: com.potli.app
productName: Potli
copyright: Copyright © 2026 Potli
# Potli doesn't use electron-updater (updates come from re-downloading/`brew
# upgrade`), so there's no auto-update feed to publish. Without this,
# electron-builder still tries to generate auto-update channel metadata for
# some Linux targets and fails when it can't determine a publish provider.
publish: null
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSScreenCaptureUsageDescription: Potli needs Screen Recording access to capture the area of your screen you select for text extraction.
    NSAppleEventsUsageDescription: Potli uses this to paste extracted text into your current app when "Copy and paste automatically" is enabled.
    LSUIElement: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: Potli
      Comment: Press a shortcut, select text on screen, it's copied.
      Categories: Utility;

deb:
  depends:
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
